<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reservar · TurnoYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="sell">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="brand-mark">TurnoYa</span></a>
      <nav class="topbar-nav">
        <a id="back-ficha" href="./ficha.html">Volver al negocio</a>
        <span class="account-slot" data-client-account></span>
      </nav>
    </header>
    <main class="band" id="root"></main>
    <footer class="demo-foot" data-demo-foot></footer>
    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/calendar.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const place = lookupPlace(params.get("id")) || lookupPlace("oasis");
      const root = document.getElementById("root");
      if (!place) {
        root.innerHTML = missingPlaceHtml();
      } else {
      const view = placeView(place);
      if (view.status !== "live" || view.suspended) {
        location.replace(`./ficha.html?id=${place.id}`);
        throw new Error("redirect");
      }
      const services = placeServices(place);
      const service = services.find((item) => item.id === params.get("service")) ?? services[0];
      const requestedReprogram = params.get("reprogram");
      const reprogramId =
        requestedReprogram && placeAllowsReprogram(place.id) ? requestedReprogram : null;
      document.getElementById("back-ficha").href = `./ficha.html?id=${place.id}`;
      const picked = normalizeService(service);
      const week = Math.min(8, Math.max(0, Number(params.get("week") || 0) || 0));
      const from = new Date();
      from.setDate(from.getDate() + week * 7);
      const days = weekDays(from);
      const expired = params.get("expired") === "1";
      const openCount = freeSlots(place.id, service, reprogramId, from).length;
      let selection = null;
      const weekQuery = (nextWeek) => {
        const q = new URLSearchParams({
          id: place.id,
          service: service.id,
        });
        if (reprogramId) q.set("reprogram", reprogramId);
        if (nextWeek) q.set("week", String(nextWeek));
        return `./reservar.html?${q}`;
      };
      const chips = services
        .map((item) => {
          const row = normalizeService(item);
          const href = `./reservar.html?id=${place.id}&service=${item.id}${
            reprogramId ? `&reprogram=${reprogramId}` : ""
          }${week ? `&week=${week}` : ""}`;
          return `<a class="${item.id === service.id ? "is-on" : ""}" href="${href}">${row.name} · ${row.minutes} min</a>`;
        })
        .join("");

      function goWithSlot(key) {
        if (reprogramId) {
          if (reprogramTurno(reprogramId, key)) location.href = "./mi-turno.html?moved=1";
          return;
        }
        writeDraft({
          placeId: place.id,
          placeName: place.name,
          slug: place.slug,
          serviceId: service.id,
          serviceName: service.name,
          minutes: picked.minutes,
          price: picked.price,
          slot: key,
          senia: seniaOf(place.id, service.price),
        });
        holdSlot(readDraft());
        ensureDemoUser();
        location.href = `./datos.html?id=${place.id}`;
      }

      function paintGrid() {
        root.innerHTML = `
          <p class="meta">${
            reprogramId
              ? "Elegí el nuevo horario. Sin cobro extra. El bloque mide la duración del servicio."
              : requestedReprogram
                ? "Este local no permite reprogramar. Podés reservar un turno nuevo."
                : "Clickeá un hueco. El bloque amarillo mide exactamente los minutos de este servicio."
          }</p>
          <h2>${place.name}</h2>
          <div class="service-picks">${chips}</div>
          <p class="band-lead">${picked.name} · ${picked.minutes} min · ${money(picked.price)} · ${hoursLabel(picked)} · ${capacityLabel(picked)}</p>
          ${picked.description ? `<p class="meta">${picked.description}</p>` : ""}
          <p class="meta" ${expired ? "" : "hidden"}>Se liberó el horario: pasaron los 15 minutos sin pagar. Elegí de nuevo.</p>
          <nav class="week-nav">
            ${
              week > 0
                ? `<a class="week-nav-btn" href="${weekQuery(week - 1)}">Anterior</a>`
                : `<span class="week-nav-btn is-off">Anterior</span>`
            }
            <p class="week-nav-label">${days[0].toLocaleDateString("es-AR", {
              day: "numeric",
              month: "short",
            })} – ${days[6].toLocaleDateString("es-AR", { day: "numeric", month: "short" })}</p>
            ${
              week < 8
                ? `<a class="week-nav-btn" href="${weekQuery(week + 1)}">Siguiente</a>`
                : `<span class="week-nav-btn is-off">Siguiente</span>`
            }
          </nav>
          <div class="cal-wrap">
            <div class="watermark cal-mark">TurnoYa</div>
            ${renderTimeGrid({ place, service: picked, days, exceptId: reprogramId, selection })}
          </div>
          <div class="tg-legend">
            <span><i class="is-busy"></i> Ocupado</span>
            <span><i class="is-buffer"></i> Margen</span>
            <span><i class="is-hold"></i> Alguien está pagando</span>
            <span><i class="is-pick"></i> Tu turno (${picked.minutes} min)</span>
          </div>
          <p class="meta" id="cal-msg"></p>
          <div id="pick-bar" ${selection ? "" : "hidden"}>
            <button class="btn btn-ticket" id="confirm-slot" type="button">${
              reprogramId ? "Confirmar nuevo horario" : "Reservar"
            } ${selection ? selection.replace("T", " ") : ""} · ${picked.minutes} min</button>
          </div>
          ${
            openCount
              ? ""
              : "<p class=\"meta\">No hay hueco donde entre este servicio en estos 7 días. Probá otro o pedile al local que abra más horas.</p>"
          }
          ${
            planAllows(place.id, "waitlist")
              ? `<p><button class="btn btn-enamel" type="button" id="wait">Avisame si se libera un horario</button></p><p class="meta" id="wait-msg"></p>`
              : ""
          }`;
        bindTimeGrid(root, {
          place,
          service: picked,
          days,
          exceptId: reprogramId,
          onPick: (key) => {
            selection = key;
            paintGrid();
          },
          onBlocked: (text) => {
            const msg = document.getElementById("cal-msg");
            if (msg) msg.textContent = text;
          },
        });
        const confirm = document.getElementById("confirm-slot");
        if (confirm && selection) confirm.addEventListener("click", () => goWithSlot(selection));
        const waitBtn = document.getElementById("wait");
        if (waitBtn) {
          waitBtn.addEventListener("click", () => {
            ensureDemoUser();
            const user = currentUser();
            const joined = joinWaitlist(place.id, {
              email: user.email,
              nombre: user.nombre,
              serviceId: service.id,
              serviceName: service.name,
              placeName: place.name,
            });
            document.getElementById("wait-msg").textContent = joined.already
              ? "Ya estás en la lista. Si se libera un hueco, te avisamos acá."
              : "Listo. Si se libera un horario, te llega a Notificaciones.";
            if (typeof paintClientAccount === "function") paintClientAccount();
          });
        }
      }
      paintGrid();
      }
    </script>
  </body>
</html>
