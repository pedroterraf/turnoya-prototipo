<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cupones · BO</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,720&family=Public+Sans:wght@400;650&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="sell">
    <header class="topbar">
      <a class="brand" href="./bo.html"><span class="brand-mark">TurnoYa</span></a>
      <a id="back" href="./bo.html">Volver</a>
    </header>
    <main class="band" id="root"></main>
    <script src="./assets/store.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/auth.js"></script>
    <script>
      const id = new URLSearchParams(location.search).get("id") || "oasis";
      requireOwner(id, `./bo-cupones.html?id=${id}`);
      document.getElementById("back").href = `./bo.html?id=${id}`;
      const place = findPlace(id);
      const services = placeServices(place);
      let rows = placeCoupons(id);
      if (!rows.length) rows = [{ code: "", type: "porcentaje", value: 10, active: true, serviceId: "" }];

      function fieldsetHtml(coupon, i) {
        return `
          <fieldset data-index="${i}">
            <label>Código <input name="code-${i}" value="${coupon.code || ""}" /></label>
            <label>Tipo
              <select name="type-${i}">
                <option value="porcentaje" ${coupon.type === "porcentaje" ? "selected" : ""}>Porcentaje</option>
                <option value="fijo" ${coupon.type === "fijo" ? "selected" : ""}>Monto fijo</option>
              </select>
            </label>
            <label>Valor <input name="val-${i}" type="number" min="1" value="${coupon.value || 10}" /></label>
            <label>Servicio
              <select name="svc-${i}">
                <option value="">Todos</option>
                ${services
                  .map(
                    (service) =>
                      `<option value="${service.id}" ${coupon.serviceId === service.id ? "selected" : ""}>${service.name}</option>`,
                  )
                  .join("")}
              </select>
            </label>
            <label><input type="checkbox" name="on-${i}" ${coupon.active !== false ? "checked" : ""} /> Activo</label>
            <button class="btn btn-line" type="button" data-remove="${i}">Quitar</button>
          </fieldset>`;
      }

      function readForm(form) {
        return [...form.querySelectorAll("fieldset")].map((box) => {
          const i = box.dataset.index;
          return {
            code: String(form[`code-${i}`].value || "").trim().toUpperCase(),
            type: form[`type-${i}`].value,
            value: Number(form[`val-${i}`].value),
            serviceId: form[`svc-${i}`].value,
            active: form[`on-${i}`].checked,
          };
        });
      }

      function paint() {
        document.getElementById("root").innerHTML = `
          <h2>Cupones de ${place.name}</h2>
          <p class="band-lead">Si no hay cupones activos, la ficha no muestra la sección. Oasis de demo: RELAX10 = 10%.</p>
          <form id="form" class="review-form wide-form">
            ${rows.map(fieldsetHtml).join("")}
            <button class="btn btn-enamel" id="add" type="button">Agregar cupón</button>
            <button class="btn btn-ticket" type="submit">Guardar</button>
          </form>`;
        const form = document.getElementById("form");
        document.getElementById("add").addEventListener("click", () => {
          rows = readForm(form);
          rows.push({ code: "", type: "porcentaje", value: 10, active: true, serviceId: "" });
          paint();
        });
        form.querySelectorAll("[data-remove]").forEach((button) => {
          button.addEventListener("click", () => {
            rows = readForm(form).filter((_, index) => index !== Number(button.dataset.remove));
            if (!rows.length) rows = [{ code: "", type: "porcentaje", value: 10, active: true, serviceId: "" }];
            paint();
          });
        });
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          savePlaceCoupons(
            id,
            readForm(form).filter((row) => row.code),
          );
          location.href = `./ficha.html?id=${id}`;
        });
      }
      paint();
    </script>
  </body>
</html>
