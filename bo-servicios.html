<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Servicios · BO</title>
    <link rel="stylesheet" href="./assets/styles.css?v=servicios3" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,720&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="sell bo-page">
    <header class="topbar">
      <a class="brand" href="./bo.html"><span class="brand-mark">TurnoYa</span></a>
      <a id="back" href="./bo.html">Volver</a>
    </header>
    <main class="band" id="root"></main>

    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const id = params.get("id") || "oasis";
      requireOwner(id, `./bo-servicios.html?id=${id}`);
      const place = findPlace(id);
      document.getElementById("back").href = `./bo.html?id=${id}`;

      let services = placeServices(place).map(normalizeService);

      function currentSvcId() {
        return new URLSearchParams(location.search).get("svcId");
      }

      function overlapMode(row) {
        if (isOpenCapacity(row)) return "unlimited";
        if (serviceCapacity(row) > 1) return "yes";
        return "no";
      }

      function formatPrice(val) {
        return "$" + Number(val || 0).toLocaleString("es-AR");
      }

      function renderCard(service) {
        const mode = overlapMode(service);
        const cap = serviceCapacity(service);
        let capText = "No se pisa";
        if (mode === "unlimited") capText = "Piso ilimitado";
        else if (mode === "yes") capText = `Cupo máx: ${cap}`;

        const fallbackImg = "https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=600&auto=format&fit=crop&q=75";
        const imgUrl = service.image || fallbackImg;

        return `
          <article class="bo-svc-card" data-service-id="${service.id}">
            <div class="bo-svc-card-imgwrap">
              <img class="bo-svc-card-img" src="${imgUrl}" alt="${service.name}" loading="lazy" onerror="this.src='${fallbackImg}'" />
              <span class="bo-svc-badge-dur">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${service.minutes} min
              </span>
              <span class="bo-svc-badge-cap">${capText}</span>
            </div>
            <div class="bo-svc-card-body">
              <h3 class="bo-svc-card-title">${service.name}</h3>
              <div class="bo-svc-card-price">${formatPrice(service.price)}</div>
              <p class="bo-svc-card-desc">${service.description || "Sin descripción cargada."}</p>
              <div class="bo-svc-card-meta">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 10"/></svg>
                <span>${service.hourStart || 9}:00 a ${service.hourEnd || 19}:00 hs</span>
              </div>
              <div class="bo-svc-card-actions">
                <a class="btn btn-ticket" href="./bo-servicios.html?id=${id}&svcId=${service.id}" data-action="edit" data-id="${service.id}">
                  Editar
                </a>
                <button class="btn-delete-card" type="button" title="Eliminar servicio" data-action="delete" data-id="${service.id}" aria-label="Eliminar servicio">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                </button>
              </div>
            </div>
          </article>
        `;
      }

      function paintListView() {
        const root = document.getElementById("root");
        root.innerHTML = `
          <div class="bo-services-shell">
            <div class="bo-services-head">
              <div>
                <h2>Servicios de ${place.name}</h2>
                <p class="band-lead">Configurá los servicios que tus clientes ven en tu ficha pública y reservan online. Hacé click en cualquier tarjeta para editarlo en su vista dedicada.</p>
              </div>
              <a class="btn btn-ticket" href="./bo-servicios.html?id=${id}&svcId=new" data-action="new">
                + Nuevo servicio
              </a>
            </div>
            <div class="bo-services-grid">
              ${services.map(renderCard).join("")}
              <a class="bo-svc-card-add" href="./bo-servicios.html?id=${id}&svcId=new" data-action="new">
                <span class="bo-svc-card-add-icon">+</span>
                <strong>Agregar otro servicio</strong>
                <span class="meta" style="margin-top: 4px;">Creá una opción nueva</span>
              </a>
            </div>
          </div>
        `;

        root.querySelectorAll('[data-action="edit"], [data-action="new"]').forEach((link) => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const url = new URL(link.href, location.origin);
            history.pushState(null, "", url.search);
            paint();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });

        root.querySelectorAll('[data-action="delete"]').forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            const targetId = btn.dataset.id;
            const svc = services.find((s) => s.id === targetId);
            if (!svc) return;
            if (confirm(`¿Seguro que querés eliminar el servicio "${svc.name}"?`)) {
              services = services.filter((s) => s.id !== targetId);
              savePlaceServices(id, services);
              paint();
            }
          });
        });
      }

      function paintEditView(svcId) {
        const isNew = svcId === "new";
        let service = services.find((s) => s.id === svcId);
        if (isNew || !service) {
          service = {
            id: isNew ? `${id}-svc-${Date.now()}` : svcId,
            name: "",
            minutes: 60,
            price: 5000,
            hourStart: 9,
            hourEnd: 19,
            description: "",
            includes: [],
            image: "https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=600&auto=format&fit=crop&q=75",
            capacity: 1,
          };
        }

        const mode = overlapMode(service);
        const cap = serviceCapacity(service);
        const root = document.getElementById("root");

        root.innerHTML = `
          <div class="bo-svc-detail-shell">
            <a class="bo-svc-back-link" href="./bo-servicios.html?id=${id}" id="back-to-list">
              ← Volver a los servicios
            </a>
            <div class="bo-svc-detail-card">
              <h2>${isNew ? "Nuevo servicio" : "Editar servicio"}</h2>
              <p class="meta" style="margin-top: 2px;">${isNew ? "Completá los datos del nuevo servicio" : `ID: ${service.id}`}</p>
              
              <form id="svc-form" class="review-form">
                <input type="hidden" name="id" value="${service.id}" />
                <label>Nombre del servicio *
                  <input name="name" required value="${service.name || ""}" placeholder="Ej. Masaje Descontracturante" autocomplete="off" />
                </label>

                <div class="grid-2col">
                  <label>Precio ($) *
                    <input name="price" type="number" min="0" step="100" required value="${service.price || 0}" />
                  </label>
                  <label>Duración (minutos) *
                    <input name="minutes" type="number" min="15" step="15" required value="${service.minutes || 60}" />
                  </label>
                </div>

                <div class="grid-2col">
                  <label>Desde (hora de inicio)
                    <input name="hourStart" type="number" min="6" max="22" value="${service.hourStart ?? 9}" />
                  </label>
                  <label>Hasta (hora de cierre)
                    <input name="hourEnd" type="number" min="7" max="23" value="${service.hourEnd ?? 19}" />
                  </label>
                </div>

                <label>¿Se puede pisar este turno?
                  <select name="overlap">
                    <option value="no" ${mode === "no" ? "selected" : ""}>No (turno exclusivo, 1 solo cliente)</option>
                    <option value="yes" ${mode === "yes" ? "selected" : ""}>Sí, con un cupo límite</option>
                    <option value="unlimited" ${mode === "unlimited" ? "selected" : ""}>Sí, ilimitado (clases grupales o eventos)</option>
                  </select>
                </label>

                <label id="cap-wrap" ${mode === "yes" ? "" : "hidden"}>
                  Cupo de clientes simultáneos
                  <input name="capacity" type="number" min="2" step="1" value="${mode === "yes" ? cap : 2}" ${mode === "yes" ? "required" : ""} />
                </label>

                <label>Descripción
                  <textarea name="description" rows="3" placeholder="Contale al cliente qué incluye o para qué sirve este servicio...">${service.description || ""}</textarea>
                </label>

                <label>Qué incluye (un punto por línea)
                  <textarea name="includes" rows="3" placeholder="Aceites esenciales&#10;Ducha escocesa&#10;Infusión de bienvenida">${(service.includes || []).join("\n")}</textarea>
                </label>

                <label>Foto (URL de imagen)
                  <input name="image" type="url" value="${service.image || ""}" placeholder="https://..." id="image-input" />
                </label>

                <div id="image-preview" style="margin-top: 6px; border-radius: 8px; overflow: hidden; height: 160px; background: #e9efe8; display: ${service.image ? "block" : "none"};">
                  <img src="${service.image || ""}" alt="Vista previa" style="width: 100%; height: 100%; object-fit: cover; display: block;" onerror="this.parentElement.style.display='none'" />
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;">
                  <button class="btn btn-ticket" type="submit" style="flex: 1;">
                    ${isNew ? "Crear servicio" : "Guardar cambios"}
                  </button>
                  <button class="btn btn-ghost" type="button" id="btn-cancel" style="color: var(--ink);">
                    Cancelar
                  </button>
                  ${
                    !isNew
                      ? `<button class="btn btn-line" type="button" id="btn-delete" style="color: var(--danger); border-color: rgba(140, 47, 29, 0.4);">
                          Eliminar
                        </button>`
                      : ""
                  }
                </div>
              </form>
            </div>
          </div>
        `;

        document.getElementById("back-to-list").addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState(null, "", `./bo-servicios.html?id=${id}`);
          paint();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        document.getElementById("btn-cancel").addEventListener("click", () => {
          history.pushState(null, "", `./bo-servicios.html?id=${id}`);
          paint();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        const overlapSelect = root.querySelector('select[name="overlap"]');
        const capWrap = document.getElementById("cap-wrap");
        const capInput = root.querySelector('input[name="capacity"]');
        overlapSelect.addEventListener("change", () => {
          const isYes = overlapSelect.value === "yes";
          capWrap.hidden = !isYes;
          if (capInput) capInput.required = isYes;
        });

        const imgInput = document.getElementById("image-input");
        const imgPreview = document.getElementById("image-preview");
        imgInput.addEventListener("input", () => {
          const url = imgInput.value.trim();
          if (url) {
            imgPreview.style.display = "block";
            imgPreview.querySelector("img").src = url;
          } else {
            imgPreview.style.display = "none";
          }
        });

        const btnDelete = document.getElementById("btn-delete");
        if (btnDelete) {
          btnDelete.addEventListener("click", () => {
            if (confirm(`¿Seguro que querés eliminar "${service.name}"?`)) {
              services = services.filter((s) => s.id !== service.id);
              savePlaceServices(id, services);
              history.pushState(null, "", `./bo-servicios.html?id=${id}`);
              paint();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });
        }

        const form = document.getElementById("svc-form");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const data = new FormData(form);
          const modeVal = data.get("overlap");
          let capacity = 1;
          if (modeVal === "unlimited") capacity = 0;
          if (modeVal === "yes") {
            capacity = Number(data.get("capacity"));
            if (!Number.isFinite(capacity) || capacity < 2) capacity = 2;
          }

          const updatedService = {
            id: service.id,
            name: String(data.get("name")).trim(),
            price: Number(data.get("price")) || 0,
            minutes: Number(data.get("minutes")) || 30,
            hourStart: Number(data.get("hourStart")) || 9,
            hourEnd: Number(data.get("hourEnd")) || 19,
            description: String(data.get("description") || "").trim(),
            includes: String(data.get("includes") || "")
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean),
            image:
              String(data.get("image") || "").trim() ||
              "https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=600&auto=format&fit=crop&q=75",
            capacity,
          };

          const existingIndex = services.findIndex((s) => s.id === service.id);
          if (existingIndex >= 0) {
            services[existingIndex] = updatedService;
          } else {
            services.push(updatedService);
          }

          savePlaceServices(id, services);
          history.pushState(null, "", `./bo-servicios.html?id=${id}`);
          paint();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      function paint() {
        const svcId = currentSvcId();
        if (svcId) {
          paintEditView(svcId);
        } else {
          paintListView();
        }
        if (typeof initCustomSelects === "function") {
          initCustomSelects();
        }
      }

      window.addEventListener("popstate", paint);
      paint();
    </script>
  </body>
</html>
