<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turno confirmado · TurnoYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="sell auth-page">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="brand-mark">TurnoYa</span></a>
      <nav class="topbar-nav">
        <span class="account-slot" data-client-account></span>
      </nav>
    </header>
    <main class="auth-shell">
      <div class="auth-card is-done">
        <p class="meta">Listo</p>
        <h1>Turno confirmado</h1>
        <p class="band-lead" id="detail"></p>
        <p>Te dejamos el aviso en tu bandeja. Si te arrepentís (10 días y el servicio no se prestó), desde Mis turnos pedís la devolución.</p>
        <div id="go-links"></div>
        <a class="btn btn-enamel" href="./mi-turno.html">Ver mi turno</a>
        <a class="btn-line" href="./notificaciones.html">Ver notificaciones</a>
        <a class="btn-line" href="./index.html">Volver al mapa</a>
      </div>
    </main>
    <footer class="demo-foot" data-demo-foot></footer>
    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/platform.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const user = currentUser();
      const mine = user ? userTurnos(user.email) : [];
      const turno = lastTurno() || mine[mine.length - 1] || null;
      document.getElementById("detail").textContent = turno
        ? `${turno.placeName} · ${turno.serviceName} · ${String(turno.slot || "").replace("T", " ")} · seña ${money(turno.senia || 0)}`
        : "No hay un turno recién confirmado. Reservá desde el mapa.";
      const go = document.getElementById("go-links");
      if (go && turno) go.innerHTML = turnoGoLinks(turno);
    </script>
  </body>
</html>
