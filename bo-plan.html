<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plan · BO</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,720&family=Public+Sans:wght@400;650&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="sell">
    <header class="topbar">
      <a class="brand" href="./bo.html"><span class="brand-mark">TurnoYa</span></a>
      <a id="back" href="./bo.html">Volver</a>
    </header>
    <main class="band" id="root"></main>
    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/auth.js"></script>
    <script>
      const id = new URLSearchParams(location.search).get("id") || "oasis";
      const need = new URLSearchParams(location.search).get("need");
      requireOwner(id, `./bo-plan.html?id=${id}`);
      document.getElementById("back").href = `./bo.html?id=${id}`;
      const place = findPlace(id);

      function paint() {
        const current = placePlan(id);
        const used = monthBookings(id);
        document.getElementById("root").innerHTML = `
          <h2>Plan de ${place.name}</h2>
          <p class="band-lead">Hoy: <strong>${current.name}</strong> · ${planPriceLabel(current)} · ${used} turnos este mes${
            current.bookings ? ` / ${current.bookings}` : ""
          }. Comisión TurnoYa 0%.</p>
          <p class="meta"><a href="./planes.html">Ver todos los planes al detalle</a></p>
          ${
            need
              ? `<p class="meta">Esa función pide un plan más alto (${need}). Barrio desbloquea espera y huecos. Ciudad suma el pin dorado.</p>`
              : ""
          }
          <div class="plan-grid">
            ${PLAN_ORDER.map((key) => {
              const plan = PLANS[key];
              const on = plan.id === current.id;
              return `<article class="plan-tile${on ? " is-hot" : ""}">
                <p class="meta">${on ? "Plan actual" : plan.tag}</p>
                <h3>${plan.name}</h3>
                <p class="plan-price">${planPriceLabel(plan)}</p>
                <p class="meta">${plan.pitch}</p>
                <ul>${planIncludeRows(plan)
                  .slice(0, 6)
                  .map((row) => `<li>${row}</li>`)
                  .join("")}</ul>
                <a class="btn-line" href="./planes.html?plan=${plan.id}">Detalle completo</a>
                <button class="btn ${on ? "btn-line" : "btn-ticket"}" type="button" data-plan="${plan.id}" ${on ? "disabled" : ""}>${
                  on ? "Activo" : `Pasar a ${plan.name}`
                }</button>
              </article>`;
            }).join("")}
          </div>
          <h3 class="ficha-sub">Extras de visibilidad</h3>
          <p class="band-lead">Se etiquetan. El cliente sabe quién pagó por estar arriba.</p>
          ${Object.values(PLAN_ADDONS)
            .map(
              (addon) => `<article class="agenda-row">
                <div><strong>${addon.name} · ${money(addon.price)} / mes</strong><p class="meta">${addon.pitch}</p></div>
                <button class="btn btn-enamel" type="button" data-addon="${addon.id}">Activar</button>
              </article>`,
            )
            .join("")}
        `;
        document.querySelectorAll("[data-plan]").forEach((button) => {
          button.addEventListener("click", () => {
            savePlacePlan(id, button.dataset.plan);
            paint();
          });
        });
        document.querySelectorAll("[data-addon]").forEach((button) => {
          button.addEventListener("click", () => {
            const featured = button.dataset.addon === "destacado" || button.dataset.addon === "patrocinado";
            patchPlaceView(id, { featured, plan: placePlanId(id) === "calle" ? "barrio" : placePlanId(id) });
            paint();
          });
        });
      }
      paint();
    </script>
  </body>
</html>
