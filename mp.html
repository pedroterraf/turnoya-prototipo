<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercado Pago</title>
    <link rel="icon" href="./assets/favicon.svg?v=ty5" type="image/svg+xml" />
    <link rel="alternate icon" href="./assets/favicon.png?v=ty5" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/favicon.png?v=ty5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="mp-page">
    <main class="auth-shell">
      <div class="auth-card mp-card">
        <p class="mp-brand">Mercado Pago</p>
        <p class="hold-clock" id="clock">15:00</p>
        <h1 id="title">Checkout</h1>
        <p class="band-lead" id="detail"></p>
        <p class="meta">Vas a pagar en Mercado Pago del local. TurnoYa no ve tu tarjeta.</p>
        <button class="btn mp-pay" id="ok" type="button">Pagar</button>
        <button class="btn btn-line" id="fail" type="button">Simular pago rechazado</button>
        <a class="btn-line" href="./pago.html">Volver a TurnoYa</a>
      </div>
    </main>
    <script src="./assets/store.js?v=motion1"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js?v=motion1"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/platform.js"></script>
    <script src="./assets/auth.js"></script>
    <script>
      const draft = ensureDemoDraft();
      if (!draft.placeId || !draft.slot) {
        location.replace("./reservar.html?id=oasis");
        throw new Error("redirect");
      }
      const senia = draft.senia ?? 0;
      const charge = draft.serviceCharge ?? serviceChargeOf();
      const total = senia + charge;
      if (total <= 0) {
        location.replace("./pago.html");
        throw new Error("redirect");
      }
      document.getElementById("title").textContent = `Pagar ${money(total)}`;
      document.getElementById("detail").textContent =
        `${draft.placeName} · ${draft.serviceName} · ${draft.slot?.replace("T", " ")}${
          charge ? ` · seña ${money(senia)} + cargo ${money(charge)}` : ""
        }`;
      document.getElementById("ok").addEventListener("click", () => {
        if (!draftHold()) {
          location.replace(`./reservar.html?id=${draft.placeId}&service=${draft.serviceId || ""}&expired=1`);
          return;
        }
        writeDraft({ pagado: true });
        const turno = confirmDraft();
        location.href = `./listo.html?id=${turno.id}`;
      });
      document.getElementById("fail").addEventListener("click", () => {
        location.replace("./pago.html?fail=1");
      });
      watchHold(
        (left) => {
          document.getElementById("clock").textContent = formatHold(left);
        },
        () => {
          location.replace(`./reservar.html?id=${draft.placeId}&service=${draft.serviceId || ""}&expired=1`);
        },
      );
    </script>
  </body>
</html>
