<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cupones y Promociones · BO</title>
    <link rel="icon" href="./assets/favicon.svg?v=ty5" type="image/svg+xml" />
    <link rel="alternate icon" href="./assets/favicon.png?v=ty5" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/favicon.png?v=ty5" />
    <link rel="stylesheet" href="./assets/styles.css?v=motion1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,720&family=Public+Sans:wght@400;550;650;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="sell bo-page">
    <header class="topbar">
      <a class="brand" href="./bo.html"><span class="brand-mark">TurnoYa</span></a>
      <a id="back" href="./bo.html">Volver</a>
    </header>
    <main class="band" id="root"></main>

    <script src="./assets/store.js?v=motion1"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js?v=motion1"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js?v=motion1"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const id = params.get("id") || "oasis";
      requireOwner(id, `./bo-cupones.html?id=${id}`);
      const back = document.getElementById("back");
      if (back) back.href = `./bo.html?id=${id}`;

      const place = findPlace(id);
      const services = placeServices(place);
      let coupons = placeCoupons(id);

      if (!coupons.length) {
        coupons = [
          { code: "RELAX10", type: "porcentaje", value: 10, active: true, visibility: "public", serviceId: "" },
          { code: "OASISVIP", type: "fijo", value: 2000, active: true, visibility: "private", serviceId: "" },
        ];
      }

      function currentCouponCode() {
        return new URLSearchParams(location.search).get("code");
      }

      function renderCouponCard(coupon) {
        const isPercent = coupon.type === "porcentaje";
        const discountText = isPercent ? `${coupon.value}% OFF` : `$${Number(coupon.value || 0).toLocaleString("es-AR")} OFF`;
        const svc = services.find((s) => s.id === coupon.serviceId);
        const svcText = svc ? svc.name : "Válido para todos los servicios";
        const isPublic = couponVisibility(coupon) === "public";
        const isActive = coupon.active !== false;

        return `
          <article class="coupon-card" data-code="${coupon.code}">
            <div class="coupon-card-header">
              <span class="coupon-code-badge">${coupon.code || "SIN CÓDIGO"}</span>
              <button class="btn-delete-card" type="button" title="Eliminar cupón" data-action="delete" data-code="${coupon.code}" aria-label="Eliminar cupón">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
              </button>
            </div>
            <div class="coupon-card-body">
              <div class="coupon-discount-val">${discountText}</div>
              <div class="coupon-target-svc">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--enamel); flex-shrink:0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 10"/></svg>
                <span>${svcText}</span>
              </div>
              <div class="coupon-badges-row">
                <span class="coupon-pill ${isPublic ? "is-public" : "is-private"}">
                  ${isPublic ? "Público en web" : "Privado (código)"}
                </span>
                <span class="coupon-pill ${isActive ? "is-active" : "is-inactive"}">
                  ${isActive ? "Activo" : "Pausado"}
                </span>
              </div>
              <div class="coupon-card-actions">
                <a class="btn btn-ticket" href="./bo-cupones.html?id=${id}&code=${encodeURIComponent(coupon.code)}" data-action="edit" data-code="${coupon.code}">
                  Editar cupón
                </a>
              </div>
            </div>
          </article>
        `;
      }

      function paintListView() {
        const root = document.getElementById("root");
        root.innerHTML = `
          <div class="bo-services-shell">
            <div class="deferred-banner" data-mvp="deferred">
              <span class="deferred-icon" aria-hidden="true">⏳</span>
              <div>
                <h4>Funcionalidad diferida (Post-MVP)</h4>
                <p>El motor de cupones y descuentos condicionales está diferido. Para el piloto MVP los servicios tienen su tarifa directa sin cupones.</p>
              </div>
            </div>

            <div class="bo-services-head">
              <div>
                <h2>Cupones de ${place.name}</h2>
                <p class="band-lead">Creá descuentos especiales. Los cupones públicos se muestran automáticamente a los clientes en tu ficha pública; los privados solo aplican si el cliente los escribe.</p>
              </div>
              <a class="btn btn-ticket" href="./bo-cupones.html?id=${id}&code=new" data-action="new">
                + Nuevo cupón
              </a>
            </div>

            <div class="bo-services-grid">
              ${coupons.map(renderCouponCard).join("")}
              <a class="bo-svc-card-add" href="./bo-cupones.html?id=${id}&code=new" data-action="new">
                <span class="bo-svc-card-add-icon">+</span>
                <strong>Agregar otro cupón</strong>
                <span class="meta" style="margin-top: 4px;">Creá una promoción nueva</span>
              </a>
            </div>
          </div>
        `;

        root.querySelectorAll('[data-action="edit"], [data-action="new"]').forEach((link) => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const url = new URL(link.href, location.origin);
            history.pushState(null, "", url.search);
            paint();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });

        root.querySelectorAll('[data-action="delete"]').forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            const targetCode = btn.dataset.code;
            if (confirm(`¿Seguro que querés eliminar el cupón "${targetCode}"?`)) {
              coupons = coupons.filter((c) => c.code !== targetCode);
              savePlaceCoupons(id, coupons);
              paint();
            }
          });
        });
      }

      function paintEditView(code) {
        const isNew = code === "new";
        let coupon = coupons.find((c) => c.code === code);
        if (isNew || !coupon) {
          coupon = {
            code: "",
            type: "porcentaje",
            value: 10,
            active: true,
            visibility: "public",
            serviceId: "",
          };
        }

        const root = document.getElementById("root");
        root.innerHTML = `
          <div class="bo-svc-detail-shell">
            <a class="bo-svc-back-link" href="./bo-cupones.html?id=${id}" id="back-to-list">
              ← Volver a los cupones
            </a>
            <div class="bo-svc-detail-card">
              <h2>${isNew ? "Nuevo cupón de descuento" : `Editar cupón: ${coupon.code}`}</h2>
              <p class="meta" style="margin-top: 2px;">${isNew ? "Completá el código y las condiciones del descuento" : "Modificá los valores de la promoción"}</p>

              <form id="coupon-form" class="review-form">
                <label>Código del cupón *
                  <input name="code" required value="${coupon.code || ""}" placeholder="Ej. VERANO20" style="text-transform:uppercase; font-family:monospace; font-weight:700; font-size:1.05rem;" autocomplete="off" />
                </label>

                <div class="grid-2col">
                  <label>Tipo de descuento *
                    <select name="type">
                      <option value="porcentaje" ${coupon.type === "porcentaje" ? "selected" : ""}>Porcentaje (% de descuento)</option>
                      <option value="fijo" ${coupon.type === "fijo" ? "selected" : ""}>Monto fijo ($ de descuento)</option>
                    </select>
                  </label>
                  <label>Valor del descuento *
                    <input name="value" type="number" min="1" step="1" required value="${coupon.value || 10}" />
                  </label>
                </div>

                <label>Aplica al servicio
                  <select name="serviceId">
                    <option value="">Aplica a todos los servicios</option>
                    ${services
                      .map(
                        (svc) => `
                        <option value="${svc.id}" ${coupon.serviceId === svc.id ? "selected" : ""}>
                          Solo para: ${svc.name}
                        </option>
                      `,
                      )
                      .join("")}
                  </select>
                </label>

                <label>Visibilidad en la web
                  <select name="visibility">
                    <option value="public" ${coupon.visibility !== "private" ? "selected" : ""}>Público · se muestra destacado en tu ficha</option>
                    <option value="private" ${coupon.visibility === "private" ? "selected" : ""}>Privado · solo para clientes que tengan el código</option>
                  </select>
                </label>

                <div style="margin-top:8px;">
                  <label class="switch-wrap" for="coupon-active-toggle">
                    <input class="switch-input" type="checkbox" id="coupon-active-toggle" name="active" ${coupon.active !== false ? "checked" : ""} />
                    <span class="switch-slider"></span>
                    <span class="switch-label-text">Cupón activo y disponible</span>
                  </label>
                </div>

                <div style="display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;">
                  <button class="btn btn-ticket" type="submit" style="flex:1;">
                    ${isNew ? "Crear cupón" : "Guardar cambios"}
                  </button>
                  <button class="btn btn-ghost" type="button" id="btn-cancel" style="color:var(--ink);">
                    Cancelar
                  </button>
                  ${
                    !isNew
                      ? `<button class="btn btn-line" type="button" id="btn-delete" style="color:var(--danger); border-color:rgba(140, 47, 29, 0.4);">
                          Eliminar
                        </button>`
                      : ""
                  }
                </div>
              </form>
            </div>
          </div>
        `;

        document.getElementById("back-to-list").addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState(null, "", `./bo-cupones.html?id=${id}`);
          paint();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        document.getElementById("btn-cancel").addEventListener("click", () => {
          history.pushState(null, "", `./bo-cupones.html?id=${id}`);
          paint();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        const btnDelete = document.getElementById("btn-delete");
        if (btnDelete) {
          btnDelete.addEventListener("click", () => {
            if (confirm(`¿Seguro que querés eliminar el cupón "${coupon.code}"?`)) {
              coupons = coupons.filter((c) => c.code !== coupon.code);
              savePlaceCoupons(id, coupons);
              history.pushState(null, "", `./bo-cupones.html?id=${id}`);
              paint();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });
        }

        const form = document.getElementById("coupon-form");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const data = new FormData(form);
          const newCode = String(data.get("code") || "").trim().toUpperCase();
          if (!newCode) return;

          const updatedCoupon = {
            code: newCode,
            type: data.get("type"),
            value: Number(data.get("value")) || 10,
            serviceId: data.get("serviceId") || "",
            visibility: data.get("visibility") === "private" ? "private" : "public",
            active: document.getElementById("coupon-active-toggle").checked,
          };

          const existingIndex = coupons.findIndex((c) => c.code === coupon.code);
          if (existingIndex >= 0 && !isNew) {
            coupons[existingIndex] = updatedCoupon;
          } else {
            // Reemplazar si ya existe un código igual o pushear
            const dupIndex = coupons.findIndex((c) => c.code === newCode);
            if (dupIndex >= 0) {
              coupons[dupIndex] = updatedCoupon;
            } else {
              coupons.push(updatedCoupon);
            }
          }

          savePlaceCoupons(id, coupons);
          history.pushState(null, "", `./bo-cupones.html?id=${id}`);
          paint();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      function paint() {
        const code = currentCouponCode();
        if (code) {
          paintEditView(code);
        } else {
          paintListView();
        }
        if (typeof initCustomSelects === "function") {
          initCustomSelects();
        }
      }

      window.addEventListener("popstate", paint);
      paint();
    </script>
  </body>
</html>
