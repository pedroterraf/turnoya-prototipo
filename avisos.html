<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avisos · TurnoYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="sell">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="brand-mark">TurnoYa</span></a>
      <nav class="topbar-nav">
        <a href="./index.html">Mapa</a>
        <a href="./mi-turno.html">Mis turnos</a>
        <span class="account-slot" data-client-account></span>
      </nav>
    </header>
    <main class="band narrow" id="root"></main>
    <footer class="demo-foot" data-demo-foot></footer>
    <script src="./assets/store.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const user = requireUser("./avisos.html");
      if (!user) throw new Error("redirect");
      const notes = userNotes(user.email);
      const root = document.getElementById("root");
      if (!notes.length) {
        root.innerHTML =
          "<h2>Sin avisos</h2><p class=\"band-lead\">Cuando reserves, canceles o el local confirme, aparece acá el mail y el WhatsApp mock.</p>";
      } else {
        root.innerHTML = `<h2>Avisos</h2><p class="band-lead">Mail y WhatsApp del prototipo. En producción salen por esos canales.</p>${notes
          .map(
            (note) =>
              `<article class="quote"><p>${note.text}</p><p class="meta">${new Date(note.at).toLocaleString("es-AR")}</p></article>`,
          )
          .join("")}`;
      }
    </script>
  </body>
</html>
