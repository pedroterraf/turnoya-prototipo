  <body class="sell auth-page">

        "bo-soporte",

        "ficha",

        "listo",

        "mp",
        "negocio-resenas",
        "negocios",
        "ops",
        "ops-altas",
        "ops-dinero",
        "ops-locales",
        "ops-login",
        "pago",
        "perfil",
        "recorrido",
        "reservar",
      ];
      if (known.includes(page)) {
        location.replace(`./${page}.html${location.search}${location.hash}`);
      }
