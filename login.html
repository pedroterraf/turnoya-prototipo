<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · TurnoYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css?v=ui-fix4" />
  </head>
  <body class="sell auth-page">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="brand-mark">TurnoYa</span></a>
    </header>
    <main class="auth-shell">
      <div class="auth-card">
        <p class="meta">Cliente</p>
        <h1>Entrar con tu mail</h1>
        <p class="band-lead">Te mandamos un código de 6 dígitos. En el prototipo es 123456.</p>
        <form id="email-form" class="review-form">
          <label>Email <input name="email" type="email" required placeholder="tu@correo.com" autocomplete="email" /></label>
          <button class="btn btn-enamel" type="submit">Enviar código</button>
          <button class="btn btn-ticket" id="skip" type="button">Seguir con datos de prueba</button>
        </form>
        <form id="otp-form" class="review-form" hidden>
          <p class="meta" id="otp-hint"></p>
          <div class="otp" role="group" aria-label="Código de 6 dígitos"></div>
          <input type="hidden" name="code" />
          <button class="btn btn-ticket" type="submit">Verificar</button>
          <button class="btn-link" id="change-email" type="button" style="background:none;border:none;color:var(--enamel);text-decoration:underline;cursor:pointer;font-size:0.85rem;padding:6px 0;text-align:left;">← Cambiar email</button>
          <p id="otp-msg" class="meta"></p>
        </form>
      </div>
    </main>
    <footer class="demo-foot" data-demo-foot></footer>
    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/platform.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const next = new URLSearchParams(location.search).get("next") || "./mi-turno.html";
      if (currentUser() && profileComplete(currentUser())) location.replace(next);
      const otp = mountOtp(document.getElementById("otp-form"), () => {
        document.getElementById("otp-form").requestSubmit();
      });
      document.getElementById("email-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const email = new FormData(event.target).get("email");
        sendOtp(email);
        event.target.hidden = true;
        document.getElementById("otp-form").hidden = false;
        document.getElementById("otp-hint").textContent = `Código enviado a ${email}. Pegalo o escribilo.`;
        if (typeof showAppToast === "function") {
          showAppToast({ title: "Código enviado", body: "En el prototipo es 123456.", tone: "success" });
        }
        otp.focus();
      });
      document.getElementById("change-email")?.addEventListener("click", () => {
        document.getElementById("otp-form").hidden = true;
        document.getElementById("email-form").hidden = false;
        document.getElementById("email-form").querySelector("input[name='email']")?.focus();
      });
      document.getElementById("skip").addEventListener("click", () => {
        ensureDemoUser();
        location.href = next;
      });
      document.getElementById("otp-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const ok = verifyOtp(otp.read());
        if (!ok) {
          document.getElementById("otp-msg").textContent = "Código incorrecto. Probá 123456.";
          if (typeof showAppToast === "function") {
            showAppToast({ title: "Código incorrecto", body: "Probá 123456.", tone: "error" });
          }
          return;
        }
        location.href = profileComplete(currentUser()) ? next : `./perfil.html?next=${encodeURIComponent(next)}`;
      });
    </script>
  </body>
</html>
