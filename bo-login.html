<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dueño · TurnoYa</title>
    <link rel="icon" href="./assets/favicon.svg?v=ty5" type="image/svg+xml" />
    <link rel="alternate icon" href="./assets/favicon.png?v=ty5" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/favicon.png?v=ty5" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,720&family=Public+Sans:wght@400;650&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="sell auth-page">
    <header class="topbar">
      <a class="brand" href="./negocios.html"><span class="brand-mark">TurnoYa</span><span class="brand-aside">dueño</span></a>
    </header>
    <main class="auth-shell">
      <div class="auth-card">
        <p class="meta">Dueño del local</p>
        <h1 id="title">Entrar al backoffice</h1>
        <p class="band-lead">Te mandamos un código de 6 dígitos al mail del local.</p>
        <form id="email-form" class="review-form">
          <label>Email del local <input name="email" type="email" required placeholder="dueno@tulocal.com" autocomplete="email" /></label>
          <button class="btn btn-enamel" type="submit">Enviar código</button>
        </form>
        <form id="otp-form" class="review-form" hidden>
          <p class="meta" id="otp-hint"></p>
          <div class="otp" role="group" aria-label="Código de 6 dígitos"></div>
          <input type="hidden" name="code" />
          <button class="btn btn-ticket" type="submit">Entrar</button>
          <button class="btn-link" id="change-email" type="button" style="background:none;border:none;color:var(--enamel);text-decoration:underline;cursor:pointer;font-size:0.85rem;padding:6px 0;text-align:left;">← Cambiar email</button>
          <p id="otp-msg" class="meta"></p>
        </form>
      </div>
    </main>
    <footer class="demo-foot" data-demo-foot></footer>
    <script src="./assets/store.js?v=motion1"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js?v=motion1"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/platform.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js?v=motion1"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const id = params.get("id") || "oasis";
      const next = params.get("next") || `./bo-agenda.html?id=${id}`;
      const place = findPlace(id);
      document.getElementById("title").textContent = `Dueño · ${place.name}`;
      if (currentOwner()?.placeId === id) location.replace(next);
      const otp = mountOtp(document.getElementById("otp-form"), () => {
        document.getElementById("otp-form").requestSubmit();
      });
      document.getElementById("email-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const email = new FormData(event.target).get("email");
        sendOtp(email);
        event.target.hidden = true;
        document.getElementById("otp-form").hidden = false;
        document.getElementById("otp-hint").textContent = `Código enviado a ${email}. Pegalo o escribilo.`;
        otp.focus();
      });
      document.getElementById("change-email")?.addEventListener("click", () => {
        document.getElementById("otp-form").hidden = true;
        document.getElementById("email-form").hidden = false;
        document.getElementById("email-form").querySelector("input[name='email']")?.focus();
      });
      document.getElementById("otp-form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!checkOtp(otp.read())) {
          document.getElementById("otp-msg").textContent = "Código incorrecto.";
          return;
        }
        const email = memoryGet("turnoya-otp-email");
        const seeded = PLACES.some((row) => row.id === id);
        if (id === "oasis" && email !== "oasis@turnoya.com") {
          document.getElementById("otp-msg").textContent = "Oasis es de oasis@turnoya.com.";
          return;
        }
        if (seeded && id !== "oasis" && !ownedPlaceIds().includes(id)) {
          document.getElementById("otp-msg").textContent = "Este local no es tuyo. Entrá al que diste de alta.";
          return;
        }
        saveOwner({
          email,
          placeId: id,
        });
        location.href = next;
      });
    </script>
  </body>
</html>
