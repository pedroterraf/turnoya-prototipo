<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alta · TurnoYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="sell auth-page">
    <header class="topbar">
      <a class="brand" href="./negocios.html"><span class="brand-mark">TurnoYa</span></a>
      <a href="./negocios.html">Volver</a>
    </header>
    <main class="auth-shell">
      <div class="auth-card wide">
      <p class="meta">Alta del negocio</p>
      <h1>Tu local en el mapa</h1>
      <p class="band-lead">Ops revisa el alta. Mientras tanto podés armar el backoffice; el pin no se publica hasta que aprueben.</p>
      <form id="form" class="review-form">
        <label>Nombre del negocio <input name="nombre" required placeholder="Oasis MultiSpa" /></label>
        <label>Ciudad
          <select name="ciudad">
            <option value="cordoba">Córdoba</option>
            <option value="caba">CABA</option>
            <option value="rosario">Rosario</option>
            <option value="mendoza">Mendoza</option>
            <option value="tucuman">Tucumán</option>
          </select>
        </label>
        <label>Rubro
          <select name="rubro">
            <option value="belleza">Belleza</option>
            <option value="salud">Salud</option>
            <option value="fitness">Fitness</option>
            <option value="mascotas">Mascotas</option>
            <option value="oficios">Oficios</option>
          </select>
        </label>
        <label>Servicio que se muestra <input name="servicio" placeholder="Masaje relajante" /></label>
        <label>WhatsApp <input name="whatsapp" required placeholder="351..." /></label>
        <label>CUIT (opcional) <input name="cuit" placeholder="30-12345678-9" /></label>
        <label>Plan
          <select name="plan">
            <option value="calle">Calle · gratis · 0% comisión</option>
            <option value="barrio">Barrio · $12.900 · espera y huecos</option>
            <option value="ciudad">Ciudad · $22.900 · Destacado incluido</option>
            <option value="red">Red · $49.900 · cadenas</option>
          </select>
        </label>
        <p class="meta"><a href="./planes.html">Qué incluye cada plan, precios y techos</a></p>
        <button class="btn btn-ticket" type="submit">Enviar alta</button>
      </form>
      <div id="done" hidden></div>
      </div>
    </main>
    <footer class="demo-foot" data-demo-foot></footer>
    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/platform.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const picked = new URLSearchParams(location.search).get("plan");
      if (picked && document.querySelector(`[name=plan] option[value="${picked}"]`)) {
        document.querySelector("[name=plan]").value = picked;
      }
      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.target);
        const name = String(data.get("nombre")).trim();
        const slug = name
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");
        const city = data.get("ciudad");
        const place = {
          id: slug || `local-${Date.now()}`,
          name,
          slug,
          category: data.get("rubro"),
          service: String(data.get("servicio") || "").trim() || "Consulta",
          city,
          lat: CITIES[city].lat + 0.004,
          lng: CITIES[city].lng + 0.004,
          km: 0.5,
          featured: false,
          nextSlot: "Hoy 16:00",
          whatsapp: data.get("whatsapp"),
          cuit: String(data.get("cuit") || "").trim(),
          status: "pending",
          plan: data.get("plan") || "calle",
          featured: data.get("plan") === "ciudad" || data.get("plan") === "red",
        };
        saveExtraPlace(place);
        savePaymentRule(place.id, { ...paymentRule(place.id), mpConnected: false });
        rememberOwned(place.id);
        event.target.hidden = true;
        const done = document.getElementById("done");
        done.hidden = false;
        done.innerHTML = `
          <h2>Alta enviada</h2>
          <p class="band-lead">turnoya.com/${place.slug} queda en revisión. No aparece en el mapa hasta que Ops apruebe.</p>
          <a class="btn btn-enamel" href="./bo-login.html?id=${place.id}">Armar el backoffice</a>
          <a class="btn btn-ghost" href="./ops-login.html?next=${encodeURIComponent(`./ops-altas.html`)}">Ver la cola de Ops</a>
        `;
      });
    </script>
  </body>
</html>
