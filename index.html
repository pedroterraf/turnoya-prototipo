<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TurnoYa — turnos cerca tuyo</title>
    <link rel="icon" href="./assets/favicon.svg?v=ty5" type="image/svg+xml" />
    <link rel="alternate icon" href="./assets/favicon.png?v=ty5" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/favicon.png?v=ty5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="./assets/styles.css?v=motion3" />
  </head>
  <body class="map-home">
    <a class="skip" href="#query">Ir a la búsqueda</a>
    <header class="topbar">
      <a class="brand" href="./index.html">
        <span class="brand-mark">TurnoYa</span>
        <span class="brand-aside">Argentina</span>
      </a>
      <span class="theme-slot" data-theme-slot></span>
      <nav class="topbar-nav">
        <label>
          <span class="visually-hidden">País</span>
          <select id="country" class="city-select" aria-label="Elegir país">
            <option value="Argentina">Argentina</option>
          </select>
        </label>
        <label>
          <span class="visually-hidden">Provincia</span>
          <select id="province" class="city-select" aria-label="Elegir provincia">
            <option value="Córdoba">Córdoba</option>
          </select>
        </label>
        <label>
          <span class="visually-hidden">Ciudad</span>
          <select id="city" class="city-select" aria-label="Elegir ciudad">
            <option value="Córdoba">Córdoba</option>
          </select>
        </label>
        <a class="hide-sm" href="./mi-turno.html">Mis turnos</a>
        <a class="hide-sm" href="./negocios.html">¿Tenés un negocio?</a>
        <span class="account-slot" data-client-account></span>
      </nav>
    </header>

    <main class="market" id="market">
      <section class="map-wrap" aria-label="Mapa de negocios">
        <div id="map" class="map"></div>
        <div class="map-hud">
          <span class="live-chip" id="live-chip">En vivo</span>
          <button class="live-chip live-chip-btn" id="follow-me" type="button" aria-pressed="false">
            Seguirme
          </button>
        </div>
        <div class="watermark">TurnoYa</div>
      </section>

      <section class="rail" id="rail" aria-label="Lista de negocios">
        <button class="rail-toggle" id="rail-toggle" type="button" aria-expanded="false" aria-controls="rail-body">
          <span class="rail-handle" aria-hidden="true"></span>
          <span id="rail-toggle-label">Ver lista</span>
        </button>
        <div class="rail-body" id="rail-body">
          <div class="ticket">
            <span>Turno · cerca</span>
            <h1>¿Qué necesitás hoy?</h1>
            <p id="location-status">Pedimos tu ubicación para marcarte en vivo y decirte cómo llegar.</p>
            <p class="meta">Buscá un servicio. El mapa te muestra lo que hay cerca.</p>
            <div class="search-row">
              <input
                id="query"
                type="search"
                placeholder="Masaje, kinesio, corte, vet…"
                autocomplete="off"
              />
              <button class="btn btn-enamel" id="search-btn" type="button">Buscar</button>
            </div>
          </div>
          <div class="rail-scroll">
            <div id="home-turns" class="home-turns" hidden></div>
            <div id="reco" class="reco">
              <h2>Recomendados cerca tuyo</h2>
              <div class="reco-carousel">
                <button class="reco-nav" type="button" data-reco-dir="-1" aria-label="Anterior">‹</button>
                <div id="reco-track" class="reco-track"></div>
                <button class="reco-nav" type="button" data-reco-dir="1" aria-label="Siguiente">›</button>
              </div>
            </div>
            <div class="results">
              <h2 id="results-count">Cerca</h2>
              <div id="results-list"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <aside id="drawer" class="drawer" hidden></aside>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./assets/store.js?v=motion1"></script>
    <script src="./assets/geo.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js?v=motion3"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/platform.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js?v=motion1"></script>
    <script>
      startMarket();
    </script>
  </body>
</html>
