<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Servicios · BO</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,720&family=Public+Sans:wght@400;650&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="sell">
    <header class="topbar">
      <a class="brand" href="./bo.html"><span class="brand-mark">TurnoYa</span></a>
      <a id="back" href="./bo.html">Volver</a>
    </header>
    <main class="band" id="root"></main>
    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/auth.js"></script>
    <script>
      const id = new URLSearchParams(location.search).get("id") || "oasis";
      requireOwner(id, `./bo-servicios.html?id=${id}`);
      const place = findPlace(id);
      document.getElementById("back").href = `./bo.html?id=${id}`;
      let services = placeServices(place).map(normalizeService);

      function overlapMode(row) {
        if (isOpenCapacity(row)) return "unlimited";
        if (serviceCapacity(row) > 1) return "yes";
        return "no";
      }

      function fieldsetHtml(row, i) {
        const mode = overlapMode(row);
        const cap = serviceCapacity(row);
        return `
          <fieldset data-index="${i}">
            <label>Nombre <input name="name-${i}" value="${row.name || ""}" /></label>
            <label>Minutos <input name="min-${i}" type="number" min="15" step="15" value="${row.minutes}" /></label>
            <label>Precio <input name="price-${i}" type="number" min="0" value="${row.price}" /></label>
            <label>Desde (hora) <input name="from-${i}" type="number" min="6" max="22" value="${row.hourStart}" /></label>
            <label>Hasta (hora) <input name="to-${i}" type="number" min="7" max="23" value="${row.hourEnd}" /></label>
            <label>Descripción <textarea name="desc-${i}">${row.description || ""}</textarea></label>
            <label>Incluye (uno por línea) <textarea name="inc-${i}">${(row.includes || []).join("\n")}</textarea></label>
            <label>Foto (URL) <input name="img-${i}" value="${row.image || ""}" /></label>
            <label>¿Se puede pisar este turno?
              <select name="overlap-${i}">
                <option value="no" ${mode === "no" ? "selected" : ""}>No</option>
                <option value="yes" ${mode === "yes" ? "selected" : ""}>Sí, con un tope</option>
                <option value="unlimited" ${mode === "unlimited" ? "selected" : ""}>Sí, ilimitado</option>
              </select>
            </label>
            <label data-cap-wrap="${i}" ${mode === "yes" ? "" : "hidden"}>
              Veces que se puede pisar
              <input name="cap-${i}" type="number" min="2" step="1" value="${mode === "yes" ? cap : 2}" ${
                mode === "yes" ? "required" : ""
              } />
            </label>
            <button class="btn btn-line" type="button" data-remove="${i}">Quitar servicio</button>
          </fieldset>`;
      }

      function readForm(form) {
        return [...form.querySelectorAll("fieldset")].map((box) => {
          const i = box.dataset.index;
          const mode = form[`overlap-${i}`].value;
          let capacity = 1;
          if (mode === "unlimited") capacity = 0;
          if (mode === "yes") {
            capacity = Number(form[`cap-${i}`].value);
            if (!Number.isFinite(capacity) || capacity < 2) capacity = 2;
          }
          return {
            id: services[Number(i)]?.id || `${id}-new-${i}`,
            name: form[`name-${i}`].value,
            minutes: Number(form[`min-${i}`].value),
            price: Number(form[`price-${i}`].value),
            hourStart: Number(form[`from-${i}`].value),
            hourEnd: Number(form[`to-${i}`].value),
            description: form[`desc-${i}`].value,
            includes: String(form[`inc-${i}`].value || "")
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean),
            image: form[`img-${i}`].value,
            capacity,
          };
        });
      }

      function paint() {
        document.getElementById("root").innerHTML = `
          <h2>Servicios de ${place.name}</h2>
          <p class="band-lead">Si se pisa, el cliente no ve el hueco como ocupado. Tenés que poner cuántas veces, o ilimitado. El backoffice sí muestra el turno.</p>
          <form id="form" class="review-form wide-form">
            ${services.map(fieldsetHtml).join("")}
            <button class="btn btn-enamel" id="add" type="button">Agregar servicio</button>
            <button class="btn btn-ticket" type="submit">Guardar</button>
          </form>`;
        const form = document.getElementById("form");
        document.getElementById("add").addEventListener("click", () => {
          const cap = planLimit(id, "services");
          if (services.length >= cap) {
            location.href = planUpgradeHref(id, "servicios");
            return;
          }
          services = readForm(form);
          services.push({
            id: `${id}-new-${Date.now()}`,
            name: "Nuevo servicio",
            minutes: 30,
            price: 5000,
            hourStart: 9,
            hourEnd: 19,
            description: "",
            includes: [],
            image: "https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=800&q=80",
            capacity: 1,
          });
          paint();
        });
        form.querySelectorAll("[name^='overlap-']").forEach((select) => {
          select.addEventListener("change", () => {
            const i = select.name.slice("overlap-".length);
            const wrap = form.querySelector(`[data-cap-wrap="${i}"]`);
            const input = form[`cap-${i}`];
            const on = select.value === "yes";
            if (wrap) wrap.hidden = !on;
            if (input) input.required = on;
          });
        });
        form.querySelectorAll("[data-remove]").forEach((button) => {
          button.addEventListener("click", () => {
            services = readForm(form).filter((_, index) => index !== Number(button.dataset.remove));
            if (!services.length) return;
            paint();
          });
        });
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          savePlaceServices(id, readForm(form));
          location.href = `./ficha.html?id=${id}`;
        });
      }
      paint();
    </script>
  </body>
</html>
