<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirmar · TurnoYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="sell auth-page">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="brand-mark">TurnoYa</span></a>
      <nav class="topbar-nav">
        <span class="account-slot" data-client-account></span>
      </nav>
    </header>
    <main class="auth-shell">
      <div class="auth-card wide">
        <p class="meta">El horario queda retenido hasta que pagues. Si se vence, se libera solo.</p>
        <p class="hold-clock" id="clock">15:00</p>
        <h1>Confirmá el turno</h1>
        <p class="band-lead" id="summary"></p>
        <p id="who" class="meta"></p>
        <form id="coupon-form" class="review-form">
          <label>Cupón <input name="code" placeholder="RELAX10" /></label>
          <button class="btn btn-ghost" type="submit">Aplicar</button>
          <p id="coupon-msg" class="meta"></p>
        </form>
        <a class="btn btn-enamel" id="go-pay" href="./pago.html">Continuar</a>
      </div>
    </main>
    <footer class="demo-foot" data-demo-foot></footer>
    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const next = location.pathname + location.search;
      const user = requireUser(next);
      const draft = ensureDemoDraft();
      if (!draft.placeId || !draft.slot) {
        location.replace("./reservar.html?id=oasis");
        throw new Error("redirect");
      }
      writeDraft({
        nombre: user.nombre,
        apellido: user.apellido,
        telefono: user.celular || "",
        email: user.email,
        dni: user.dni,
      });
      document.getElementById("summary").textContent = draft.slot
        ? `${draft.placeName} · ${draft.serviceName} · ${draft.slot.replace("T", " ")} · ${money(draft.price)}`
        : "Elegí un horario.";
      document.getElementById("who").textContent = `${user.nombre} ${user.apellido} · DNI ${user.dni}`;
      const listPrice = draft.listPrice || draft.price;
      writeDraft({ listPrice });
      function paintPay(price, note) {
        const senia = seniaOf(draft.placeId, price);
        writeDraft({ price, senia });
        document.getElementById("summary").textContent =
          `${draft.placeName} · ${draft.serviceName} · ${draft.slot.replace("T", " ")} · ${money(price)}`;
        document.getElementById("go-pay").textContent =
          senia > 0 ? `Pagar ${money(senia)} en Mercado Pago` : "Confirmar sin pago";
        document.getElementById("go-pay").href = "./pago.html";
        if (note) document.getElementById("coupon-msg").textContent = note;
      }
      if (!placeCoupons(draft.placeId).some((row) => row.active)) {
        document.getElementById("coupon-form").hidden = true;
      }
      paintPay(listPrice);
      document.getElementById("coupon-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const code = new FormData(event.target).get("code");
        const result = applyCoupon(draft.placeId, code, listPrice, draft.serviceId);
        if (!result.ok) {
          document.getElementById("coupon-msg").textContent = "Cupón inválido o no aplica a este servicio.";
          return;
        }
        writeDraft({ coupon: result.coupon.code, discount: result.discount });
        paintPay(result.price, `${result.coupon.code} · −${money(result.discount)}`);
      });
      watchHold(
        (left) => {
          document.getElementById("clock").textContent = formatHold(left);
        },
        () => {
          location.replace(`./reservar.html?id=${draft.placeId}&service=${draft.serviceId || ""}&expired=1`);
        },
      );
    </script>
  </body>
</html>
