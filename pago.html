<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pago · TurnoYa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="sell auth-page">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="brand-mark">TurnoYa</span></a>
      <nav class="topbar-nav">
        <span class="account-slot" data-client-account></span>
      </nav>
    </header>
    <main class="auth-shell">
      <div class="auth-card">
        <p class="meta">Mercado Pago · prototipo</p>
        <p class="hold-clock" id="clock">15:00</p>
        <h1 id="title">Pago</h1>
        <p class="band-lead" id="detail"></p>
        <p class="meta" id="mp-note"></p>
        <p class="meta">Si te arrepentís dentro de los 10 días y el servicio no se prestó, se libera el horario y se reintegra lo pagado. Después rige la política del local.</p>
        <div class="card-box review-form" id="card-box" hidden>
          <label>Número de tarjeta <input value="4509 9535 6623 3704" inputmode="numeric" autocomplete="cc-number" /></label>
          <div class="card-box-row">
            <label>Vencimiento <input value="11/28" autocomplete="cc-exp" /></label>
            <label>CVV <input value="123" inputmode="numeric" autocomplete="cc-csc" /></label>
          </div>
        </div>
        <p class="pay-fail" id="fail-msg" hidden>Mercado Pago rechazó el pago. El horario sigue retenido: reintentá.</p>
        <button class="btn btn-ticket" id="pay" type="button">Pagar</button>
        <button class="btn btn-line" id="fail" type="button">Simular pago fallido</button>
      </div>
    </main>
    <footer class="demo-foot" data-demo-foot></footer>
    <script src="./assets/store.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const draft = ensureDemoDraft();
      if (!draft.placeId || !draft.slot) {
        location.replace("./reservar.html?id=oasis");
        throw new Error("redirect");
      }
      const senia = draft.senia ?? 0;
      const rule = paymentRule(draft.placeId);
      const pay = document.getElementById("pay");
      const fail = document.getElementById("fail");
      document.getElementById("title").textContent = senia > 0 ? `Pagar ${money(senia)}` : "Sin seña";
      document.getElementById("detail").textContent =
        `${draft.placeName} · ${draft.serviceName} · ${draft.slot?.replace("T", " ")}`;
      pay.textContent = senia > 0 ? "Ir a Mercado Pago" : "Confirmar turno";
      const blocked = senia > 0 && !rule.mpConnected;
      if (blocked) {
        document.getElementById("mp-note").textContent =
          "El local todavía no conectó Mercado Pago. No se puede cobrar la seña.";
        pay.hidden = true;
        fail.hidden = true;
        document.getElementById("card-box").hidden = true;
      } else if (senia <= 0) {
        fail.hidden = true;
      } else {
        document.getElementById("card-box").hidden = false;
      }
      function finish() {
        if (!draftHold()) {
          location.replace(`./reservar.html?id=${draft.placeId}&service=${draft.serviceId || ""}&expired=1`);
          return;
        }
        writeDraft({ pagado: senia > 0 });
        const turno = confirmDraft();
        location.href = `./listo.html?id=${turno.id}`;
      }
      pay.addEventListener("click", finish);
      fail.addEventListener("click", () => {
        document.getElementById("fail-msg").hidden = false;
        pay.textContent = "Reintentar pago";
      });
      watchHold(
        (left) => {
          document.getElementById("clock").textContent = formatHold(left);
        },
        () => {
          location.replace(`./reservar.html?id=${draft.placeId}&service=${draft.serviceId || ""}&expired=1`);
        },
      );
    </script>
  </body>
</html>
