<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soporte y Canales · BO</title>
    <link rel="stylesheet" href="./assets/styles.css?v=soporte-v3" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,720&family=Public+Sans:wght@400;550;650;750&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="sell bo-page">
    <header class="topbar">
      <a class="brand" href="./bo.html"><span class="brand-mark">TurnoYa</span></a>
      <a id="back" href="./bo.html">Volver</a>
    </header>
    <main class="band" id="root"></main>

    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const id = new URLSearchParams(location.search).get("id") || "oasis";
      if (!requireOwner(id, `./bo-soporte.html?id=${id}`)) throw new Error("redirect");
      document.getElementById("back").href = `./bo.html?id=${id}`;
      const place = findPlace(id);
      seedPlaceInbox(id);

      function deleteInquiry(placeId, inqId) {
        const rows = placeInquiries(placeId).filter((r) => r.id !== inqId);
        memorySet(`turnoya-inbox-${placeId}`, JSON.stringify(rows));
      }

      function paint() {
        const support = placeSupport(place);
        const inbox = placeInquiries(id);
        const root = document.getElementById("root");

        root.innerHTML = `
          <div class="soporte-shell">
            <div class="deferred-banner" data-mvp="deferred">
              <span class="deferred-icon" aria-hidden="true">⏳</span>
              <div>
                <h4>Funcionalidad diferida (Post-MVP)</h4>
                <p>La bandeja de soporte web interna está diferida. En el piloto MVP la atención humana se canaliza directamente por WhatsApp con el enlace directo al teléfono del local.</p>
              </div>
            </div>

            <div class="soporte-header">
              <h2>Canales de atención · ${place.name}</h2>
              <p class="band-lead">Elegí cómo querés que tus clientes te contacten (WhatsApp directo, correo electrónico o ambos). Los mensajes enviados desde la ficha web quedan registrados abajo.</p>
            </div>

            <!-- Formulario de Canales con Cards -->
            <form id="support-form">
              <div class="soporte-channels-grid">
                <!-- Canal WhatsApp -->
                <div class="soporte-channel-card">
                  <div class="soporte-channel-top">
                    <div class="soporte-channel-icon-title">
                      <div class="soporte-channel-icon is-whatsapp">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                      </div>
                      <div>
                        <h3 class="soporte-channel-title">WhatsApp directo</h3>
                        <p class="soporte-channel-subtitle">Atención humana del local</p>
                      </div>
                    </div>
                    <label class="switch-wrap" for="wpp-toggle">
                      <input class="switch-input" type="checkbox" id="wpp-toggle" name="wpp" ${support.whatsappEnabled ? "checked" : ""} />
                      <span class="switch-slider"></span>
                      <span class="switch-status-pill ${support.whatsappEnabled ? "is-on" : "is-off"}" id="wpp-pill">
                        ${support.whatsappEnabled ? "Activo" : "Pausado"}
                      </span>
                    </label>
                  </div>

                  <div class="soporte-channel-body">
                    <label style="font-size:0.85rem; font-weight:650; color:var(--ink);">Número de celular con código de área</label>
                    <div class="soporte-input-prefix-wrap">
                      <span class="soporte-input-prefix">+54</span>
                      <input name="whatsapp" id="input-wpp" value="${support.whatsapp || ""}" placeholder="Ej: 3512345678" autocomplete="tel" />
                    </div>
                    <p class="soporte-channel-desc">
                      Aparece como botón directo <strong>"Hablar con el local"</strong> en la ficha pública. El cliente chatea directamente con vos sin intermediarios.
                    </p>
                  </div>

                  <div class="soporte-channel-foot">
                    <span class="meta" style="font-size:0.78rem;">Enlace directo wa.me</span>
                    <a class="soporte-btn-test" id="btn-test-wpp" href="${whatsappHref(support.whatsapp, "Hola! Consulta desde TurnoYa")}" target="_blank" rel="noreferrer">
                      Probar enlace ↗
                    </a>
                  </div>
                </div>

                <!-- Canal Email -->
                <div class="soporte-channel-card">
                  <div class="soporte-channel-top">
                    <div class="soporte-channel-icon-title">
                      <div class="soporte-channel-icon is-email">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                      </div>
                      <div>
                        <h3 class="soporte-channel-title">Correo electrónico</h3>
                        <p class="soporte-channel-subtitle">Recepción de consultas web</p>
                      </div>
                    </div>
                    <label class="switch-wrap" for="mail-toggle">
                      <input class="switch-input" type="checkbox" id="mail-toggle" name="mail" ${support.emailEnabled ? "checked" : ""} />
                      <span class="switch-slider"></span>
                      <span class="switch-status-pill ${support.emailEnabled ? "is-on" : "is-off"}" id="mail-pill">
                        ${support.emailEnabled ? "Activo" : "Pausado"}
                      </span>
                    </label>
                  </div>

                  <div class="soporte-channel-body">
                    <label style="font-size:0.85rem; font-weight:650; color:var(--ink);">Email oficial del negocio</label>
                    <div class="soporte-input-prefix-wrap">
                      <span class="soporte-input-prefix">@</span>
                      <input name="email" type="email" id="input-mail" value="${support.email || ""}" placeholder="contacto@tunegocio.com" autocomplete="email" />
                    </div>
                    <p class="soporte-channel-desc">
                      Dirección a donde se enviarán las notificaciones de nuevos turnos y los mensajes del formulario de contacto web.
                    </p>
                  </div>

                  <div class="soporte-channel-foot">
                    <span class="meta" style="font-size:0.78rem;">Email de destino</span>
                    <a class="soporte-btn-test" id="btn-test-mail" href="mailto:${support.email || ""}">
                      Abrir correo ↗
                    </a>
                  </div>
                </div>
              </div>

              <div style="display:flex; align-items:center; gap:14px; margin-bottom:36px;">
                <button class="btn btn-ticket" type="submit" style="min-height:42px; padding:0 24px; font-size:0.95rem;">
                  Guardar configuración de canales
                </button>
                <span class="arca-save-msg" id="save-msg">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  <span>Canales guardados con éxito</span>
                </span>
              </div>
            </form>

            <!-- Bandeja de Consultas Web -->
            <div class="caja-panel">
              <div class="caja-panel-head">
                <h3>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--enamel);"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  Bandeja de consultas web
                </h3>
                <span class="meta">${inbox.length} ${inbox.length === 1 ? "mensaje" : "mensajes"}</span>
              </div>

              ${
                inbox.length
                  ? `<div class="soporte-inbox-list">
                      ${inbox
                        .map((row) => {
                          const initial = (row.nombre || "C").charAt(0).toUpperCase();
                          const replyText = `Hola ${row.nombre}, te escribo de ${place.name} por tu consulta recibida en TurnoYa.`;
                          return `
                            <article class="inbox-card" id="inq-${row.id}">
                              <div class="inbox-card-top">
                                <div class="inbox-sender-info">
                                  <div class="inbox-avatar">${initial}</div>
                                  <div>
                                    <h4 class="inbox-name">${row.nombre}</h4>
                                    <div class="inbox-meta">
                                      <span>✉️ ${row.email}</span>
                                      ${row.celular ? `<span>📱 ${row.celular}</span>` : ""}
                                      ${row.createdAt ? `<span>· ${new Date(row.createdAt).toLocaleDateString("es-AR")}</span>` : ""}
                                    </div>
                                  </div>
                                </div>
                                <button class="btn-delete-card" type="button" title="Eliminar consulta" data-action="delete-inquiry" data-id="${row.id}">
                                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                </button>
                              </div>

                              <div class="inbox-message-box">
                                "${row.mensaje || "Sin mensaje"}"
                              </div>

                              <div class="inbox-card-actions">
                                ${
                                  row.celular
                                    ? `<a class="btn btn-ticket" href="${whatsappHref(row.celular, replyText)}" target="_blank" rel="noreferrer">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                                        Responder por WhatsApp
                                      </a>`
                                    : ""
                                }
                                <a class="btn btn-enamel" href="mailto:${row.email}?subject=${encodeURIComponent(`Consulta en ${place.name}`)}&body=${encodeURIComponent(replyText)}">
                                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                  Responder por Email
                                </a>
                              </div>
                            </article>
                          `;
                        })
                        .join("")}
                    </div>`
                  : `
                    <div class="soporte-empty-state">
                      <div class="soporte-empty-icon">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                      </div>
                      <h4>No hay consultas pendientes</h4>
                      <p>Cuando un cliente deje un mensaje desde el formulario web de tu negocio, lo vas a ver acá listo para responder con un click.</p>
                      <button class="btn btn-ghost" type="button" id="btn-seed-test" style="margin-top:16px; font-size:0.84rem;">
                        + Simular consulta de prueba
                      </button>
                    </div>
                  `
              }
            </div>
          </div>
        `;

        // Switch toggles
        const wppToggle = document.getElementById("wpp-toggle");
        const wppPill = document.getElementById("wpp-pill");
        wppToggle.addEventListener("change", () => {
          const on = wppToggle.checked;
          wppPill.textContent = on ? "Activo" : "Pausado";
          wppPill.className = `switch-status-pill ${on ? "is-on" : "is-off"}`;
        });

        const mailToggle = document.getElementById("mail-toggle");
        const mailPill = document.getElementById("mail-pill");
        mailToggle.addEventListener("change", () => {
          const on = mailToggle.checked;
          mailPill.textContent = on ? "Activo" : "Pausado";
          mailPill.className = `switch-status-pill ${on ? "is-on" : "is-off"}`;
        });

        // Test links update on input
        const inputWpp = document.getElementById("input-wpp");
        const btnTestWpp = document.getElementById("btn-test-wpp");
        inputWpp.addEventListener("input", () => {
          btnTestWpp.href = whatsappHref(inputWpp.value, "Hola! Consulta desde TurnoYa");
        });

        const inputMail = document.getElementById("input-mail");
        const btnTestMail = document.getElementById("btn-test-mail");
        inputMail.addEventListener("input", () => {
          btnTestMail.href = `mailto:${inputMail.value}`;
        });

        // Guardar configuración
        document.getElementById("support-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const form = e.target;
          savePlaceSupport(id, {
            whatsappEnabled: wppToggle.checked,
            emailEnabled: mailToggle.checked,
            whatsapp: form.whatsapp.value.trim(),
            email: form.email.value.trim(),
          });

          const msg = document.getElementById("save-msg");
          msg.classList.add("is-visible");
          setTimeout(() => {
            msg.classList.remove("is-visible");
          }, 3200);
        });

        // Eliminar consulta
        root.querySelectorAll('[data-action="delete-inquiry"]').forEach((btn) => {
          btn.addEventListener("click", () => {
            const inqId = btn.dataset.id;
            deleteInquiry(id, inqId);
            paint();
          });
        });

        // Simular consulta de prueba
        const btnSeedTest = document.getElementById("btn-seed-test");
        if (btnSeedTest) {
          btnSeedTest.addEventListener("click", () => {
            saveInquiry(id, {
              nombre: "Florencia Gómez",
              email: "florencia.gomez@gmail.com",
              celular: "3516789012",
              mensaje: "Hola! Quería consultar si atienden este sábado por la tarde y si tienen disponibilidad para dos personas.",
            });
            paint();
          });
        }
      }

      paint();
    </script>
  </body>
</html>
