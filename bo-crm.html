      const id = new URLSearchParams(location.search).get("id") || "oasis";
      requireOwner(id, `./bo-crm.html?id=${id}`);
      const back = document.getElementById("back");
      if (back) back.href = `./bo.html?id=${id}`;
      paintCrmPage(document.getElementById("crm-body"), id);
