<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reseñas y Recomendaciones · BO</title>
    <link rel="stylesheet" href="./assets/styles.css?v=resenas-v4" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,720&family=Public+Sans:wght@400;550;650;750;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="sell bo-page">
    <header class="topbar">
      <a class="brand" href="./bo.html"><span class="brand-mark">TurnoYa</span></a>
      <a id="back" href="./bo.html">Volver</a>
    </header>

    <main class="band" id="panel"></main>

    <script src="./assets/store.js"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const place = (typeof findPlace === "function" ? findPlace(params.get("id")) : null) ?? PLACES[0];
      if (!requireOwner(place.id, `./negocio-resenas.html?id=${place.id}`)) throw new Error("redirect");
      document.getElementById("back").href = `./bo.html?id=${place.id}`;
      const root = document.getElementById("panel");

      function paint() {
        if (!planAllows(place.id, "texts")) {
          root.innerHTML = `
            <div class="caja-shell">
              <h2>Textos y Testimonios</h2>
              <p class="band-lead">Elegir qué recomendaciones se leen pide Barrio o más.</p>
              <a class="btn btn-ticket" href="${planUpgradeHref(place.id, "textos")}">Ver planes</a>
            </div>
          `;
          return;
        }

        const list = reviewsFor(place.id);
        const live = ratingOf(place.id);

        root.innerHTML = `
          <div class="caja-shell">
            <div class="deferred-banner" data-mvp="deferred">
              <span class="deferred-icon" aria-hidden="true">⏳</span>
              <div>
                <h4>Funcionalidad diferida (Post-MVP)</h4>
                <p>El sistema de moderación de reseñas y filtros por plan comercial está diferido para etapas posteriores al piloto.</p>
              </div>
            </div>

            <div class="bo-head" style="margin-bottom:24px;">
              <div>
                <h2>Reseñas y Recomendaciones · ${place.name}</h2>
                <p class="band-lead">Las estrellas son el promedio real de clientes que completaron su turno. Podés elegir qué testimonios destacar públicamente en tu ficha web.</p>
              </div>
              <a class="btn btn-ghost" href="./ficha.html?id=${place.id}#resenas" target="_blank" style="white-space:nowrap;">
                Ver reseñas en ficha ↗
              </a>
            </div>

            <!-- Resumen de Calificación -->
            <div class="caja-panel" style="margin-bottom:24px; background:linear-gradient(135deg, #f8faf9 0%, #ffffff 100%);">
              <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px;">
                <div style="display:flex; align-items:center; gap:18px;">
                  <div style="font-size:3rem; font-weight:800; font-family:var(--display); color:var(--enamel); line-height:1;">
                    ${live.average ? live.average.toFixed(1) : "5.0"}
                  </div>
                  <div>
                    <div style="color:#eab308; font-size:1.4rem; letter-spacing:2px; margin-bottom:4px;">
                      ${"★".repeat(Math.round(live.average || 5))}${"☆".repeat(5 - Math.round(live.average || 5))}
                    </div>
                    <p class="meta" style="margin:0; font-weight:600;">
                      Basado en <strong>${live.count || list.length} opiniones</strong> de clientes verificados
                    </p>
                  </div>
                </div>

                <div class="caja-badge" style="background:#dcfce7; color:#166534; font-size:0.85rem; padding:6px 14px; border-radius:999px;">
                  ✓ Reputación verificada
                </div>
              </div>
            </div>

            <!-- Listado de Reseñas para Curaduría -->
            <div class="caja-panel">
              <div class="caja-panel-head">
                <h3>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--enamel);"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                  Testimonios disponibles (${list.length})
                </h3>
              </div>

              ${
                list.length
                  ? `<div style="display:flex; flex-direction:column; gap:14px;">
                      ${list
                        .map((review) => {
                          const initial = (review.author || "C").charAt(0).toUpperCase();
                          const isShown = review.shownByBusiness !== false;
                          return `
                            <article class="inbox-card" style="padding:18px;">
                              <div class="inbox-card-top">
                                <div class="inbox-sender-info">
                                  <div class="inbox-avatar">${initial}</div>
                                  <div>
                                    <h4 class="inbox-name">${review.author}</h4>
                                    <div style="color:#eab308; font-size:0.95rem; margin-top:2px;">
                                      ${"★".repeat(review.stars)}${"☆".repeat(5 - review.stars)}
                                    </div>
                                  </div>
                                </div>
                                <label class="switch-wrap">
                                  <input class="switch-input" type="checkbox" data-id="${review.id}" ${isShown ? "checked" : ""} />
                                  <span class="switch-slider"></span>
                                  <span class="switch-label-text" style="font-size:0.82rem;">${isShown ? "Visible en web" : "Oculto"}</span>
                                </label>
                              </div>
                              <div class="inbox-message-box" style="font-style:italic;">
                                "${review.text || "Sin comentario escrito"}"
                              </div>
                            </article>
                          `;
                        })
                        .join("")}
                    </div>`
                  : `<p class="meta" style="text-align:center; padding:32px; background:#fafbfa; border:1.5px dashed var(--line); border-radius:10px;">
                      Todavía no hay reseñas cargadas. Cuando un cliente concrete y califique su turno, vas a poder decidir cuáles publicar acá.
                    </p>`
              }
            </div>
          </div>
        `;

        root.querySelectorAll("input[type=checkbox]").forEach((input) => {
          input.addEventListener("change", () => {
            setQuoteVisible(place.id, input.dataset.id, input.checked);
            paint();
          });
        });
      }

      paint();
    </script>
  </body>
</html>
