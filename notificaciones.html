<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notificaciones · TurnoYa</title>
    <link rel="icon" href="./assets/favicon.svg?v=ty5" type="image/svg+xml" />
    <link rel="alternate icon" href="./assets/favicon.png?v=ty5" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/favicon.png?v=ty5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,720;12..96,800&family=Public+Sans:wght@400;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css?v=motion1" />
  </head>
  <body class="sell">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="brand-mark">TurnoYa</span></a>
      <nav class="topbar-nav">
        <a class="hide-sm" href="./index.html">Mapa</a>
        <a class="hide-sm" href="./mi-turno.html">Mis turnos</a>
        <span class="account-slot" data-client-account></span>
      </nav>
    </header>
    <main class="band notice-page" id="root"></main>
    <footer class="demo-foot" data-demo-foot></footer>
    <script src="./assets/store.js?v=motion1"></script>
    <script src="./assets/notifications.js"></script>
    <script src="./assets/reviews.js"></script>
    <script src="./assets/app.js?v=motion1"></script>
    <script src="./assets/booking.js"></script>
    <script src="./assets/plans.js"></script>
    <script src="./assets/platform.js"></script>
    <script src="./assets/auth.js"></script>
    <script src="./assets/site.js?v=motion1"></script>
    <script>
      const role = new URLSearchParams(location.search).get("rol");
      const owner = role === "dueno" ? requireOwner((currentOwner() || {}).placeId || "oasis") : currentOwner();
      const user = role === "dueno" ? owner : requireUser("./notificaciones.html");
      const userKey = user?.email;
      if (!userKey) throw new Error("redirect");

      function paint() {
        const rows = findMyNotifications(userKey);
        const unread = rows.filter((row) => !row.isRead).length;
        const root = document.getElementById("root");
        if (!rows.length) {
          root.innerHTML =
            "<h2>Avisos</h2><p class=\"band-lead\">Cuando reserves, canceles o el local confirme, te avisamos acá.</p>";
          return;
        }
        function noticeIcon(row) {
          const type = row.metadata?.type || "";
          if (type === "TURNO" || /calific/i.test(row.title)) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
          }
          return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Zm4 9a2 2 0 0 0 4 0"/></svg>';
        }
        function timeAgo(ts) {
          const min = Math.max(0, Math.round((Date.now() - Number(ts)) / 60000));
          if (min < 1) return "Ahora";
          if (min < 60) return `Hace ${min} min`;
          const hours = Math.round(min / 60);
          if (hours < 24) return `Hace ${hours} h`;
          const days = Math.round(hours / 24);
          return `Hace ${days} día${days > 1 ? "s" : ""}`;
        }
        root.innerHTML = `
          <h2>Avisos</h2>
          <p class="band-lead">${unread ? `${unread} sin leer.` : "Todo leído."}</p>
          ${
            unread
              ? `<button class="btn btn-enamel" type="button" id="read-all">Marcar todas como leídas</button>`
              : ""
          }
          <div class="notice-list">
          ${rows
            .map((row) => {
              const href = notificationHref(row);
              return `<article class="notice${row.isRead ? "" : " is-unread"}" data-id="${row.id}">
                <span class="notice-ico" aria-hidden="true">${noticeIcon(row)}</span>
                <div>
                  <p class="notice-kicker">${row.isRead ? "" : '<span class="notice-dot"></span>'}${row.isRead ? "Leída" : "Nueva"} · ${timeAgo(row.createdAt)}</p>
                  <h3>${row.title}</h3>
                  <p>${row.body}</p>
                  <div class="notice-actions">
                    ${href ? `<a class="btn btn-ticket" href="${href}" data-open="${row.id}">Abrir</a>` : ""}
                    <button class="btn btn-line" type="button" data-toggle="${row.id}" data-read="${row.isRead ? "0" : "1"}">${
                      row.isRead ? "Marcar no leída" : "Marcar leída"
                    }</button>
                  </div>
                </div>
              </article>`;
            })
            .join("")}
          </div>
        `;
        const readAll = document.getElementById("read-all");
        if (readAll) {
          readAll.addEventListener("click", () => {
            markAllRead(userKey);
            paint();
            paintClientAccount();
            if (typeof showAppToast === "function") {
              showAppToast({ title: "Todos los avisos quedaron leídos", tone: "success" });
            }
          });
        }
        root.querySelectorAll("[data-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            setReadState(button.dataset.toggle, userKey, button.dataset.read === "1");
            paint();
            paintClientAccount();
          });
        });
        root.querySelectorAll("[data-open]").forEach((link) => {
          link.addEventListener("click", () => {
            setReadState(link.dataset.open, userKey, true);
          });
        });
      }

      paint();
    </script>
  </body>
</html>
